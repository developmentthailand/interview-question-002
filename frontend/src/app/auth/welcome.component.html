<section class="welcome-card" aria-labelledby="welcome-title">
  <div class="welcome-symbol" aria-hidden="true">
    <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="1.4"/><path d="m15 24 6 6 12-13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <p class="welcome-kicker">SIGN IN COMPLETE</p>
  <h2 id="welcome-title" [attr.aria-label]="'Welcome User : ' + user().username"><span>Welcome User :</span><span class="user-name">{{ user().username }}</span></h2>
  <p class="welcome-copy">Your account is ready. You have signed in securely.</p>
  <div class="identity-row"><span class="identity-avatar">{{ user().username.charAt(0).toUpperCase() }}</span><span><small>Signed in as</small><strong>{{ user().username }}</strong></span></div>
  <button class="sign-out-button" type="button" (click)="signedOut.emit()">Sign out</button>
</section>
